version: '3.8'

services:
  db:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: agriclutch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrilink
      POSTGRES_PASSWORD: agrilink_secure_password
      POSTGRES_DB: agrilink_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrilink -d agrilink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriclutch-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://agrilink:agrilink_secure_password@db:5432/agrilink_db
      APP_ENV: development
      DEBUG: "True"
      SERVICE_NAME: agriclutch-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
